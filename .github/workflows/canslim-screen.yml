name: CAN SLIM screen

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: canslim-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install requests beautifulsoup4

      - name: Run the screen
        env:
          SCREENER_USER: ${{ secrets.SCREENER_USER }}
          SCREENER_PASS: ${{ secrets.SCREENER_PASS }}
        run: |
          mkdir -p canslim
          python canslim_screener.py --out canslim/canslim_screen.json

      - name: Commit the result
        if: always()
        run: |
          git config user.name  "canslim-bot"
          git config user.email "canslim-bot@users.noreply.github.com"
          [ -d canslim ] || exit 0
          git add canslim/
          if git diff --cached --quiet; then
            echo "No change in the screen."
          else
            git commit -m "CAN SLIM screen $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M') IST"
            git push
          fi
